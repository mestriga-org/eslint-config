include:
  ./pnpm-config.yaml: '*'

catalogMode: prefer

nodeOptions: >-
  ${NODE_OPTIONS- }
  --no-addons
  --disable-proto=delete
  --force-context-aware
  --force-node-api-uncaught-exceptions-policy
  --frozen-intrinsics
  --no-global-search-paths
  --pending-deprecation
  --tls-min-v1.3

catalog:
  eslint: ^10.13.0
